version: '3.8'

services:
  api:
    build: .
    container_name: ngi_agent_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./qdrant_data:/app/qdrant_data
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    image: node:22-alpine
    container_name: ngi_agent_web
    working_dir: /app
    environment:
      - API_URL=http://api:8000
    volumes:
      - ./src/web:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
